<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: #111111; }
      .border { stroke: #444444; }
      .text { fill: #ffffff; }
      .dot { fill: #ffffff; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0a0a0a; }
      .border { stroke: #333333; }
      .text { fill: #ffffff; }
      .dot { fill: #ffffff; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="16" fill="#0a0a0a"/>
  <rect class="border" x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#333333" stroke-width="2"/>
  <text class="text" x="28" y="38" dominant-baseline="central" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, Menlo, monospace" font-weight="700" font-size="24" letter-spacing="-0.04em">ZH</text>
  <circle class="dot" cx="48" cy="38" r="3.5" fill="#ffffff"/>
</svg>

